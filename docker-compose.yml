name: weiyu

services:
  mysql:
    image: mysql:8.0
    container_name: weiyu-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: weiyu
      MYSQL_USER: weiyu
      MYSQL_PASSWORD: weiyu123456
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123456"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: weiyu-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: weiyu-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: weiyu
      RABBITMQ_DEFAULT_PASS: weiyu123456
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # 管理台 http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    container_name: weiyu-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      MYSQL_DSN: "weiyu:weiyu123456@tcp(mysql:3306)/weiyu?charset=utf8mb4&parseTime=True&loc=Local"
      REDIS_ADDR: "redis:6379"
      RABBITMQ_URL: "amqp://weiyu:weiyu123456@rabbitmq:5672/"
      JWT_SECRET: "please-change-me-to-a-random-secret-32bytes"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
